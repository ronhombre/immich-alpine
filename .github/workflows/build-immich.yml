name: Build Immich APK for Alpine 3.24

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      immich_rev:
        description: 'Upstream Immich tag, branch, or commit'
        required: true
        default: 'v3.3.5'
      release_tag:
        description: 'Release tag to attach the APK to (optional)'
        required: false
        default: ''
      apk_version:
        description: 'Alpine package version; required for branch/commit builds'
        required: false
        default: ''
      apk_release:
        description: 'Alpine package revision (0, 1, 2, ...)'
        required: false
        default: '1'
      apk_maintainer:
        description: 'Package maintainer, e.g. Your Name <you@example.com> (public metadata)'
        required: false
        default: 'Ron Lauren Hombre <ronlauren@hombre.asia>'
      bundle_runtime:
        description: 'Include required runtime library files in the Immich APK'
        type: boolean
        required: false
        default: true
      extism_tag:
        description: 'Pinned Extism JS tag (blank resolves latest)'
        required: false
        default: ''

# Environment secret in Auto Build: APK_SIGNING_KEY contains an unencrypted
# PEM private key. It is required for release uploads; artifact-only builds
# may run unsigned. Only its public half is published with the APK.
# Optional repository variable: APK_MAINTAINER supplies the public maintainer
# field; the manual apk_maintainer input overrides it for one build.
# APK_DESCRIPTION and APK_URL repository variables may customize those public
# metadata fields. When empty, the builder uses its Immich defaults.
permissions:
  id-token: write
  contents: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-26.04
    environment: Auto Build
    container:
      image: alpine:3.24
      options: --user root
    defaults:
      run:
        shell: bash
    env:
      ARTIFACT_DIR: /tmp/immich-alpine-dist
      # Auto Release dispatches this workflow with a release_tag, so checking
      # only for a release event would miss that release-signing requirement.
      REQUIRE_APK_SIGNING: ${{ github.event_name == 'release' || inputs.release_tag != '' }}

    steps:
      - name: Bootstrap Bash and checkout dependencies
        shell: sh
        run: |
          set -eu
          apk add --no-cache bash git gcompat libc6-compat

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Determine Immich revision
        id: rev
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_IMMICH_REV: ${{ inputs.immich_rev }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -Eeuo pipefail
          if [[ "$EVENT_NAME" == release ]]; then
            immich_rev="$EVENT_RELEASE_TAG"
            release_tag="$EVENT_RELEASE_TAG"
          else
            immich_rev="$INPUT_IMMICH_REV"
            release_tag="$INPUT_RELEASE_TAG"
          fi
          [[ "$immich_rev" =~ ^[A-Za-z0-9][A-Za-z0-9._/+\-]*$ && "$immich_rev" != *..* ]] || {
            echo 'ERROR: Invalid upstream Immich revision.' >&2
            exit 1
          }
          [[ -z "$release_tag" || "$release_tag" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]*$ ]] || {
            echo 'ERROR: Invalid GitHub release tag.' >&2
            exit 1
          }
          printf 'immich_rev=%s\nrelease_tag=%s\n' "$immich_rev" "$release_tag" >> "$GITHUB_OUTPUT"

      - name: Check APK signing configuration
        env:
          APK_SIGNING_KEY_PEM: ${{ secrets.APK_SIGNING_KEY }}
        run: |
          set -Eeuo pipefail
          set +x
          if [[ -n "${APK_SIGNING_KEY_PEM//[[:space:]]/}" ]]; then
            echo 'APK signing key is available from the Auto Build environment.'
          elif [[ "$REQUIRE_APK_SIGNING" == true ]]; then
            echo '::error::APK_SIGNING_KEY is unavailable in the Auto Build environment. A signed release is required; refusing to build or upload an unsigned APK.'
            exit 1
          else
            echo '::warning::APK_SIGNING_KEY is unavailable. This artifact-only build will produce an unsigned APK.'
          fi

      - name: Install build dependencies
        run: |
          set -Eeuo pipefail
          # Install the common toolchain and runtime libraries from Alpine 3.24.
          apk add --no-cache \
            apk-tools openssl sed curl \
            nodejs npm pnpm python3 python3-dev py3-pip uv \
            ffmpeg7 build-base git wget unzip jq util-linux openrc postgresql-client \
            perl perl-compress-raw-zlib perl-compress-raw-bzip2 \
            perl-net-ssleay perl-io-socket-ssl \
            perl-capture-tiny perl-file-which perl-file-chdir \
            perl-extutils-pkgconfig perl-ffi-checklib \
            perl-test-warnings perl-test-fatal perl-test-needs \
            perl-test2-suite perl-sort-versions perl-path-tiny \
            perl-try-tiny perl-term-table perl-mojolicious perl-file-slurper \
            abseil-cpp abseil-cpp-flags-marshalling \
            lcms2 mesa-gl geos file binutils \
            vips vips-cpp vips-jxl vips-dev libraw libraw-dev \
            py3-opencv py3-onnxruntime py3-numpy-dev geos-dev py3-shapely \
            protobuf-dev py3-nanobind py3-yaml

          # Use the newer native libraries required by Sharp while keeping the
          # related vips packages aligned. By default the builder merges the
          # required runtime library files into the Immich APK, so ordinary
          # apk add installs them with the application. When bundling is
          # disabled, provide compatible runtime libraries separately.
          apk add --upgrade --no-cache \
            --repository https://dl-cdn.alpinelinux.org/alpine/edge/community \
            vips vips-cpp vips-dev vips-jxl libraw libraw-dev

      - name: Build and Sign APK
        id: build
        env:
          IMMICH_REV: ${{ steps.rev.outputs.immich_rev }}
          IMMICH_ALPINE_RELEASE: ${{ steps.rev.outputs.release_tag }}
          APK_VERSION: ${{ inputs.apk_version }}
          APK_RELEASE: ${{ inputs.apk_release || '1' }}
          APK_MAINTAINER: ${{ inputs.apk_maintainer || vars.APK_MAINTAINER }}
          APK_DESCRIPTION: ${{ vars.APK_DESCRIPTION }}
          APK_URL: ${{ vars.APK_URL }}
          # Release-triggered builds default to bundling. A manual false must
          # become 0 rather than be replaced by a truthy fallback expression.
          APK_BUNDLE_RUNTIME: ${{ github.event_name == 'workflow_dispatch' && inputs.bundle_runtime == false && '0' || '1' }}
          EXTISM_JS_TAG: ${{ inputs.extism_tag }}
          APK_SIGNING_KEY_PEM: ${{ secrets.APK_SIGNING_KEY }}
        run: |
          set -Eeuo pipefail
          set +x
          if [[ "$REQUIRE_APK_SIGNING" == true && -z "${APK_SIGNING_KEY_PEM//[[:space:]]/}" ]]; then
            echo '::error::Release signing requires APK_SIGNING_KEY from the Auto Build environment.'
            exit 1
          fi
          signing_dir=''
          verification_keys_dir=''
          signed=false
          signing_args=()
          cleanup_signing() {
            local status=$?
            trap - EXIT
            if [[ -n "$signing_dir" ]]; then
              if ! rm -rf -- "$signing_dir"; then
                echo '::error::Could not remove the temporary private signing key.' >&2
                status=1
              fi
            fi
            exit "$status"
          }
          trap cleanup_signing EXIT
          if [[ -n "${APK_SIGNING_KEY_PEM//[[:space:]]/}" ]]; then
            signing_dir="$(mktemp -d /tmp/immich-apk-signing.XXXXXXXX)"
            printf 'signing_dir=%s\n' "$signing_dir" >> "$GITHUB_OUTPUT"
            (umask 077; printf '%s\n' "$APK_SIGNING_KEY_PEM" > "$signing_dir/immich.rsa")
            # Keep an independently derived PUBLIC key for the next step.
            verification_keys_dir="$(mktemp -d /tmp/immich-apk-verify.XXXXXXXX)"
            printf 'verification_keys_dir=%s\n' "$verification_keys_dir" >> "$GITHUB_OUTPUT"
            openssl pkey -in "$signing_dir/immich.rsa" -passin pass: -pubout \
              -out "$verification_keys_dir/immich.rsa.pub"
            signing_args=(--signing-key "$signing_dir/immich.rsa")
            signed=true
          fi
          # The root builder reads the file only while packaging. Do not pass
          # the secret value to upstream source/dependency build processes.
          unset APK_SIGNING_KEY_PEM
          # Give this invocation its own output directory. Artifact discovery
          # below must not pick up an APK left by an earlier build.
          mkdir -p -- "$ARTIFACT_DIR"
          ARTIFACT_DIR="$(mktemp -d "$ARTIFACT_DIR/build.XXXXXXXX")"
          export ARTIFACT_DIR
          bash ./build-immich-alpine.sh "${signing_args[@]}"
          printf 'artifact_dir=%s\nsigned=%s\n' "$ARTIFACT_DIR" "$signed" >> "$GITHUB_OUTPUT"

      - name: Verify Built APK
        id: build_verify
        env:
          VERIFICATION_KEYS_DIR: ${{ steps.build.outputs.verification_keys_dir }}
          APK_SIGNED: ${{ steps.build.outputs.signed }}
          ARTIFACT_DIR: ${{ steps.build.outputs.artifact_dir }}
        run: |
          set -Eeuo pipefail
          if [[ "$ARTIFACT_DIR" != /* || "$ARTIFACT_DIR" == / || ! -d "$ARTIFACT_DIR" || -L "$ARTIFACT_DIR" ]]; then
            echo '::error::Build step did not return a valid artifact directory.' >&2
            exit 1
          fi
          case "$APK_SIGNED" in
            true|false) ;;
            *) echo '::error::Build step did not return a valid signing status.' >&2; exit 1 ;;
          esac
          if [[ "$REQUIRE_APK_SIGNING" == true && "$APK_SIGNED" != true ]]; then
            echo '::error::Refusing to publish an unsigned release APK.' >&2
            exit 1
          fi
          arch="$(apk --print-arch)"
          case "$arch" in
            x86_64|aarch64) ;;
            *) echo "ERROR: Unsupported artifact architecture: $arch" >&2; exit 1 ;;
          esac
          # APK_VERSION may be blank here: the builder resolves it in a child
          # process. Use the actual output instead of reconstructing its name.
          shopt -s nullglob
          apk_files=("$ARTIFACT_DIR"/*.apk)
          shopt -u nullglob
          if (( ${#apk_files[@]} != 1 )); then
            echo "ERROR: Expected one Immich APK, found ${#apk_files[@]} in $ARTIFACT_DIR." >&2
            exit 1
          fi
          asset="${apk_files[0]##*/}"
          if [[ ! "$asset" =~ ^immich-alpine-[0-9][A-Za-z0-9._+]*-r[0-9]+\.apk$ ]]; then
            echo "ERROR: Unexpected APK filename: $asset (expected immich-alpine-VERSION-rREVISION.apk)." >&2
            exit 1
          fi
          echo "Checking generated APK: $asset"
          require_output_file() {
            if [[ ! -f "$1" || -L "$1" || ! -s "$1" ]]; then
              echo "::error::Missing, empty, or symlinked build output: $1" >&2
              exit 1
            fi
          }
          for file in "$ARTIFACT_DIR/$asset" "$ARTIFACT_DIR/$asset.sha256"; do
            require_output_file "$file"
          done
          if ! (cd "$ARTIFACT_DIR" && sha256sum -c "$asset.sha256"); then
            echo "::error::Checksum verification failed for $asset." >&2
            exit 1
          fi
          output_files=("$ARTIFACT_DIR/$asset" "$ARTIFACT_DIR/$asset.sha256")
          if [[ "$APK_SIGNED" == true ]]; then
            if [[ "$VERIFICATION_KEYS_DIR" != /tmp/immich-apk-verify.* || ! -d "$VERIFICATION_KEYS_DIR" || -L "$VERIFICATION_KEYS_DIR" ]]; then
              echo '::error::Expected public verification-key directory is missing or invalid.' >&2
              exit 1
            fi
            require_output_file "$VERIFICATION_KEYS_DIR/immich.rsa.pub"
            require_output_file "$ARTIFACT_DIR/$asset.pub"
            # Trust the key derived from the secret, not merely the key shipped
            # beside the package. The private key has already been deleted.
            if ! cmp -s "$VERIFICATION_KEYS_DIR/immich.rsa.pub" "$ARTIFACT_DIR/$asset.pub"; then
              echo '::error::Published public key does not match APK_SIGNING_KEY.' >&2
              exit 1
            fi
            if ! apk verify --keys-dir "$VERIFICATION_KEYS_DIR" "$ARTIFACT_DIR/$asset"; then
              echo "::error::APK signature verification failed for $asset." >&2
              exit 1
            fi
            output_files+=("$ARTIFACT_DIR/$asset.pub")
          else
            # Unsigned artifact-only builds still need an integrity check.
            if ! apk verify --allow-untrusted "$ARTIFACT_DIR/$asset"; then
              echo "::error::Unsigned APK integrity verification failed for $asset." >&2
              exit 1
            fi
          fi

          # Runtime library files belong to the main APK. Publish only the
          # verified APK, checksum, and optional public key from this build.
          {
            printf 'arch=%s\nartifact_name=%s\nfiles<<IMMICH_APK_FILES\n' "$arch" "${asset%.apk}"
            printf '%s\n' "${output_files[@]}"
            printf 'IMMICH_APK_FILES\n'
          } >> "$GITHUB_OUTPUT"

      - name: Remove temporary signing and verification keys
        if: always()
        env:
          SIGNING_DIR: ${{ steps.build.outputs.signing_dir }}
          VERIFICATION_KEYS_DIR: ${{ steps.build.outputs.verification_keys_dir }}
        run: |
          set -Eeuo pipefail
          if [[ "$SIGNING_DIR" =~ ^/tmp/immich-apk-signing\.[A-Za-z0-9]+$ ]]; then
            rm -rf -- "$SIGNING_DIR"
          fi
          if [[ "$VERIFICATION_KEYS_DIR" =~ ^/tmp/immich-apk-verify\.[A-Za-z0-9]+$ ]]; then
            rm -rf -- "$VERIFICATION_KEYS_DIR"
          fi

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.build_verify.outputs.files }}

      - name: Upload APK to GitHub Release
        if: steps.rev.outputs.release_tag != ''
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.build_verify.outputs.files }}
          fail_on_unmatched_files: true
          tag_name: ${{ steps.rev.outputs.release_tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK as workflow artifact
        if: steps.rev.outputs.release_tag == ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build_verify.outputs.artifact_name }}
          path: ${{ steps.build_verify.outputs.files }}
          if-no-files-found: error
          retention-days: 30
